name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.name }}
      module-version: ${{ steps.version.outputs.module }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Resolve CI version
        id: version
        run: |
          echo "name=$(python3 tools/build-version.py ci)" >> "$GITHUB_OUTPUT"
          echo "module=$(python3 tools/build-version.py ci --component xposed)" >> "$GITHUB_OUTPUT"
      - name: Test and build
        env:
          CI_VERSION: ${{ steps.version.outputs.name }}
          MODULE_VERSION: ${{ steps.version.outputs.module }}
        run: |
          python3 tools/test-build-version.py
          ./gradlew --no-daemon -PciVersionName="$CI_VERSION" -PmoduleCiVersionName="$MODULE_VERSION" :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :xposed:assembleDebug :xposed:lintDebug
      - name: Verify APK separation
        run: python3 tools/verify-apk-split.py app/build/outputs/apk/debug/app-debug-unsigned.apk xposed/build/outputs/apk/debug/xposed-debug-unsigned.apk
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: unsigned-ci
          path: |
            app/build/outputs/apk/debug/*.apk
            xposed/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ci-reports
          path: |
            app/build/reports/
            app/build/test-results/
            xposed/build/reports/
          retention-days: 14

  sign:
    needs: build
    # Fork PRs cannot access the publishing key and do not produce a signed APK.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: unsigned-ci
          path: unsigned
      - name: Restore signing files
        run: |
          set +x
          umask 077
          mkdir -p "$RUNNER_TEMP/hduhelper-signing"
          cat > "$RUNNER_TEMP/hduhelper-signing/keystore.base64" <<'KEYSTORE_EOF'
          ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_EOF
          cat > "$RUNNER_TEMP/hduhelper-signing/release.password" <<'PASSWORD_EOF'
          ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PASSWORD_EOF
          test "$(wc -c < "$RUNNER_TEMP/hduhelper-signing/release.password")" -gt 1
          base64 --decode "$RUNNER_TEMP/hduhelper-signing/keystore.base64" > "$RUNNER_TEMP/hduhelper-signing/release.p12"
          test -s "$RUNNER_TEMP/hduhelper-signing/release.p12"
          rm "$RUNNER_TEMP/hduhelper-signing/keystore.base64"
      - name: Sign and verify CI APK
        env:
          CI_VERSION: ${{ needs.build.outputs.version }}
          MODULE_VERSION: ${{ needs.build.outputs.module-version }}
        run: |
          python3 tools/sign-release.py --apk unsigned/app/build/outputs/apk/debug/app-debug-unsigned.apk \
            --output "dist/HDUHelper-$CI_VERSION.apk" --ci-version "$CI_VERSION" \
            --signing-dir "$RUNNER_TEMP/hduhelper-signing" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          python3 tools/sign-release.py --component xposed --apk unsigned/xposed/build/outputs/apk/debug/xposed-debug-unsigned.apk \
            --output "dist/HDUHelper-Xposed-$MODULE_VERSION.apk" --ci-version "$MODULE_VERSION" \
            --signing-dir "$RUNNER_TEMP/hduhelper-signing" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: HDUHelper-${{ needs.build.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
      - name: Remove signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/hduhelper-signing"
