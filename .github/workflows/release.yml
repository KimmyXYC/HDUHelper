name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        run: |
          python3 tools/test-build-version.py
          python3 tools/build-version.py release --tag "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Test and optimize release
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :xposed:assembleRelease :xposed:lintRelease
      - name: Verify APK separation
        run: python3 tools/verify-apk-split.py app/build/outputs/apk/release/app-release-unsigned.apk xposed/build/outputs/apk/release/xposed-release-unsigned.apk
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: unsigned-release
          path: |
            app/build/outputs/apk/release/*-unsigned.apk
            xposed/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: release-diagnostics-${{ github.ref_name }}
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/
            app/build/test-results/
            xposed/build/reports/
            xposed/build/outputs/mapping/release/
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; existing attachments will not be overwritten.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: unsigned-release
          path: unsigned
      - name: Restore signing files
        # Generated values are base64 and hexadecimal respectively. Passwords are
        # written from the runner's script to files, never passed via env/argv.
        run: |
          set +x
          umask 077
          mkdir -p "$RUNNER_TEMP/hduhelper-signing"
          cat > "$RUNNER_TEMP/hduhelper-signing/keystore.base64" <<'KEYSTORE_EOF'
          ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_EOF
          cat > "$RUNNER_TEMP/hduhelper-signing/release.password" <<'PASSWORD_EOF'
          ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PASSWORD_EOF
          test -s "$RUNNER_TEMP/hduhelper-signing/keystore.base64"
          test "$(wc -c < "$RUNNER_TEMP/hduhelper-signing/release.password")" -gt 1
          base64 --decode "$RUNNER_TEMP/hduhelper-signing/keystore.base64" > "$RUNNER_TEMP/hduhelper-signing/release.p12"
          test -s "$RUNNER_TEMP/hduhelper-signing/release.p12"
          rm "$RUNNER_TEMP/hduhelper-signing/keystore.base64"
      - name: Sign and verify
        run: |
          python3 tools/sign-release.py --apk unsigned/app/build/outputs/apk/release/app-release-unsigned.apk \
            --output "dist/HDUHelper-$GITHUB_REF_NAME.apk" \
            --signing-dir "$RUNNER_TEMP/hduhelper-signing" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" --tag "$GITHUB_REF_NAME"
          module_version=$(python3 tools/build-version.py version --component xposed)
          python3 tools/sign-release.py --component xposed --apk unsigned/xposed/build/outputs/apk/release/xposed-release-unsigned.apk \
            --output "dist/HDUHelper-Xposed-$module_version.apk" \
            --signing-dir "$RUNNER_TEMP/hduhelper-signing" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" --tag "$GITHUB_REF_NAME"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if test -f "$notes"; then
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Remove signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/hduhelper-signing"
